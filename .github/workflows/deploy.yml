# Every change pushed to the main branch is checked, then sent to the live site.
# Set-up (once) is described in README.md.

name: Check and deploy

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# One deploy at a time, in order.
concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  check:
    name: Check the site
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: pdo_sqlite, mbstring, fileinfo, gd
          coverage: none
      - run: bash scripts/check.sh

  deploy:
    name: Send to the live site
    needs: check
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment: live
    steps:
      - uses: actions/checkout@v4

      - name: Is the hosting connected?
        id: host
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
        run: |
          if [ -z "$FTP_SERVER" ]; then
            echo "ready=no" >> "$GITHUB_OUTPUT"
            echo "::notice::Checks passed. Nothing was sent to the live site because the hosting details are not set yet (see README.md)."
          else
            echo "ready=yes" >> "$GITHUB_OUTPUT"
          fi

      - name: Stamp the version
        if: steps.host.outputs.ready == 'yes'
        run: echo "${GITHUB_SHA::7}, $(date -u +'%-d %b %Y %H:%M') UTC" > site/version.txt

      # Uploads only the files that changed. It never touches config.php, the
      # database, or the menu pictures and PDFs the team uploaded: those are not
      # in GitHub, and files this step did not upload itself are left alone.
      - name: Upload what changed
        if: steps.host.outputs.ready == 'yes'
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ${{ vars.FTP_PROTOCOL || 'ftps' }}
          port: ${{ vars.FTP_PORT || 21 }}
          local-dir: ./site/
          server-dir: ${{ secrets.FTP_SERVER_DIR }}
          exclude: |
            **/.git*
            **/.git*/**
            config.php
            storage/*.sqlite
            storage/installed.lock
